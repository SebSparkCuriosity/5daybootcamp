name: lint

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cross-skill contract lint
        run: python3 tools/lint_plugin.py

      - name: Version must move when the plugin changes
        run: |
          base="origin/${{ github.base_ref || github.event.repository.default_branch }}"
          git fetch origin --quiet || true
          python3 tools/check_version_bump.py "$base"

      - name: Compile every Python helper
        run: |
          find plugins tools docs -name "*.py" -print0 | xargs -0 python3 -m py_compile

      - name: Syntax-check every shell script
        run: |
          find plugins -name "*.sh" -print0 | xargs -0 -n1 bash -n

      - name: Pre-work + Day 1 smoke test (runs the real scripts end to end)
        run: python3 tools/smoke_test.py
