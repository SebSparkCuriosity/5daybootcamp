<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{HEADLINE}}</title>
<meta name="description" content="{{SUBHEAD}}">
<!--
  Capture store wiring. Paste your Supabase project URL and anon (publishable)
  key here. See capture-store.md for how to create the table and policy.
  Leave them blank to use the Formspree fallback (set FORMSPREE_ID instead).
-->
<script>
  window.SPARK_CAPTURE = {
    supabaseUrl: "{{SUPABASE_URL}}",
    supabaseAnonKey: "{{SUPABASE_ANON}}",
    kind: "{{CAPTURE_KIND}}",
    formspreeId: "{{FORMSPREE_ID}}"
  };
</script>
<style>
  :root {
    --brand: {{BRAND_PRIMARY}};
    --accent: {{BRAND_SECONDARY}};
    --on-accent: {{ON_ACCENT}};
    --ink: {{BRAND_PRIMARY}};
    --paper: #ffffff;
    --muted: #4a4a4a;
    --line: #e6e6e6;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: "{{FONT_BODY}}", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.55;
  }
  h1, h2, .logo {
    font-family: "{{FONT_HEADING}}", "{{FONT_BODY}}", system-ui, sans-serif;
    line-height: 1.15;
  }
  a { color: var(--brand); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px; }
  header { display: flex; align-items: center; gap: 12px; padding: 20px 24px; }
  header img { height: 40px; width: auto; }
  .logo { font-size: 1.25rem; font-weight: 700; }
  main { padding: 32px 24px 8px; }
  h1 { font-size: clamp(1.9rem, 6vw, 3rem); margin: 0 0 12px; }
  .subhead { font-size: 1.2rem; color: var(--muted); margin: 0 0 8px; max-width: 560px; }
  .metric {
    display: inline-block; margin: 16px 0 24px; padding: 6px 14px;
    background: var(--accent); color: var(--on-accent); border-radius: 999px;
    font-weight: 600; font-size: 0.95rem;
  }
  .hero-media { margin: 8px 0 28px; }
  .hero-media img { max-width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); }
  form { display: grid; gap: 14px; max-width: 440px; margin: 8px 0 4px; }
  label { font-weight: 600; font-size: 0.95rem; }
  input, textarea {
    font: inherit; padding: 12px 14px; border: 1.5px solid var(--line);
    border-radius: 8px; width: 100%; background: #fff; color: var(--ink);
  }
  input:focus, textarea:focus, button:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  .consent { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: 0.9rem; color: var(--muted); }
  .consent input { width: auto; margin-top: 3px; }
  button {
    font: inherit; font-weight: 700; cursor: pointer;
    background: var(--brand); color: #fff; border: 0;
    padding: 14px 22px; border-radius: 8px; font-size: 1.05rem;
  }
  button:hover { filter: brightness(1.08); }
  .status { min-height: 1.4em; font-size: 0.95rem; margin-top: 4px; }
  .status.ok { color: {{BRAND_PRIMARY}}; font-weight: 600; }
  .status.err { color: #b00020; font-weight: 600; }
  footer { border-top: 1px solid var(--line); margin-top: 40px; padding: 24px; color: var(--muted); font-size: 0.85rem; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<header>
  {{LOGO_BLOCK}}
  <span class="logo">{{BRAND_NAME}}</span>
</header>

<main>
  <h1>{{HEADLINE}}</h1>
  <p class="subhead">{{SUBHEAD}}</p>
  <span class="metric">{{METRIC}}</span>

  {{HERO_MEDIA}}

  <form id="capture-form" novalidate>
    {{FORM_FIELDS}}
    <div class="consent">
      <input type="checkbox" id="consent" name="consent" required>
      <label for="consent">I agree to be contacted about this. See the <a href="{{PRIVACY_HREF}}">privacy notice</a>.</label>
    </div>
    <button type="submit">{{CTA_LABEL}}</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>
</main>

<footer>
  <p>{{TAGLINE}}</p>
  <p><a href="{{PRIVACY_HREF}}">Privacy notice</a></p>
</footer>

<script>
(function () {
  var cfg = window.SPARK_CAPTURE || {};
  var form = document.getElementById("capture-form");
  var status = document.getElementById("status");

  function setStatus(msg, ok) {
    status.textContent = msg;
    status.className = "status " + (ok ? "ok" : "err");
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!document.getElementById("consent").checked) {
      setStatus("Please tick the consent box so we can contact you.", false);
      return;
    }
    var data = { kind: cfg.kind || "lead", created_at: new Date().toISOString() };
    Array.prototype.forEach.call(form.elements, function (el) {
      if (el.name && el.type !== "submit" && el.name !== "consent") data[el.name] = el.value;
    });

    // Preferred store: Supabase REST insert (insert-only RLS, no read from browser).
    if (cfg.supabaseUrl && cfg.supabaseAnonKey) {
      fetch(cfg.supabaseUrl.replace(/\/$/, "") + "/rest/v1/captures", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": cfg.supabaseAnonKey,
          "Authorization": "Bearer " + cfg.supabaseAnonKey,
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({ kind: data.kind, payload: data })
      }).then(function (r) {
        if (r.ok) { form.reset(); setStatus("Thank you. We will be in touch.", true); }
        else { setStatus("Something went wrong. Please email us instead.", false); }
      }).catch(function () { setStatus("Something went wrong. Please email us instead.", false); });
      return;
    }

    // Fallback store: Formspree endpoint (no backend needed).
    if (cfg.formspreeId) {
      fetch("https://formspree.io/f/" + cfg.formspreeId, {
        method: "POST",
        headers: { "Accept": "application/json", "Content-Type": "application/json" },
        body: JSON.stringify(data)
      }).then(function (r) {
        if (r.ok) { form.reset(); setStatus("Thank you. We will be in touch.", true); }
        else { setStatus("Something went wrong. Please email us instead.", false); }
      }).catch(function () { setStatus("Something went wrong. Please email us instead.", false); });
      return;
    }

    setStatus("Capture store not wired yet. See capture-store.md.", false);
  });
})();
</script>
</body>
</html>
